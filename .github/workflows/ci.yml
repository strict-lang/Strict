name: CI
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FOLDERS: Bytecode Compression Validators Examples Examples/BaseTypesTest Examples/CompactTypeTest Examples/NativeAdd Examples/Parsing ImageProcessing MachineLearning Math
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: llvm
        with:
          path: Tools/LLVM-23.1.3-Linux-X64
          key: llvm-23.1.3-linux-x64-opt-llc
      - name: LLVM 22 (clang, mlir-opt, mlir-translate, opt, llc)
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p Tools
          curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.xz | tar -xJ -C Tools LLVM-23.1.3-Linux-X64/bin/clang LLVM-23.1.3-Linux-X64/bin/clang-23 LLVM-23.1.3-Linux-X64/bin/mlir-opt LLVM-23.1.3-Linux-X64/bin/mlir-translate LLVM-23.1.3-Linux-X64/bin/opt LLVM-23.1.3-Linux-X64/bin/llc LLVM-23.1.3-Linux-X64/lib/clang/23/include
      - uses: actions/cache/save@v4
        if: steps.llvm.outputs.cache-hit != 'true'
        with:
          path: Tools/LLVM-23.1.3-Linux-X64
          key: llvm-23.1.3-linux-x64-opt-llc
      - name: Bootstrap from the seed
        run: |
          echo "$PWD/Tools/LLVM-23.1.3-Linux-X64/bin" >> "$GITHUB_PATH"
          sh Compiler/bootstrap.sh
      - name: Tests on the Strict VM
        run: |
          for folder in $FOLDERS; do
            ./strict test "$folder" > test.log 2>&1 || { grep -v "^Test passed" test.log; exit 1; }
          done
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      FOLDERS: Compression Examples/BaseTypesTest Examples/CompactTypeTest Examples/NativeAdd Examples/Parsing Math
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: llvm
        with:
          path: Tools/LLVM-23.1.3-Windows
          key: llvm-23.1.3-windows-opt-llc
      - name: clang, opt and llc 23
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p Tools/LLVM-23.1.3-Windows
          curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/clang+llvm-23.1.3-x86_64-pc-windows-msvc.tar.xz | tar -xJ -C Tools/LLVM-23.1.3-Windows --strip-components=1 clang+llvm-23.1.3-x86_64-pc-windows-msvc/bin/clang.exe clang+llvm-23.1.3-x86_64-pc-windows-msvc/bin/opt.exe clang+llvm-23.1.3-x86_64-pc-windows-msvc/bin/llc.exe clang+llvm-23.1.3-x86_64-pc-windows-msvc/lib/clang/23/include
      - uses: actions/cache/save@v4
        if: steps.llvm.outputs.cache-hit != 'true'
        with:
          path: Tools/LLVM-23.1.3-Windows
          key: llvm-23.1.3-windows-opt-llc
      - name: mlir-opt and mlir-translate 23 from MSYS2
        run: |
          /c/msys64/usr/bin/pacman.exe -Sy --noconfirm
          /c/msys64/usr/bin/pacman.exe -U --noconfirm https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-cc-libs-16.2.0-6-any.pkg.tar.zst https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-gcc-libs-16.2.0-6-any.pkg.tar.zst https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-llvm-libs-23.1.3-1-any.pkg.tar.zst https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-mlir-23.1.3-1-any.pkg.tar.zst
          cygpath -w "$PWD/Tools/LLVM-23.1.3-Windows/bin" >> "$GITHUB_PATH"
      - name: Bootstrap from the seed
        shell: cmd
        run: Compiler\Bootstrap.cmd
      - name: Tests on the Strict VM
        run: |
          for folder in $FOLDERS; do
            ./strict.exe test "$folder" > test.log 2>&1 || { grep -v "^Test passed" test.log; exit 1; }
          done
