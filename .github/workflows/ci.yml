name: CI
on:
  push:
  pull_request:
jobs:
  linux:
    name: linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            units: Compression Validators Examples ImageProcessing MachineLearning Math Networking Json Xml Binary
            native: Compression Validators Examples ImageProcessing MachineLearning Math Networking Json Xml Binary
          - name: internal
            native: Bytecode Runtime Expressions
          - name: neural
            units: NeuralNetworks
            native: NeuralNetworks
          - name: compiler 1
            files: Compiler
            part: 0/2
          - name: compiler 2
            files: Compiler
            part: 1/2
    env:
      UNITS: ${{ matrix.units }}
      FILES: ${{ matrix.files }}
      NATIVE: ${{ matrix.native }}
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: llvm
        with:
          path: Tools/LLVM-23.1.3-Linux-X64
          key: llvm-23.1.3-linux-x64-opt-llc
      - name: LLVM 23 (clang, mlir-opt, mlir-translate, opt, llc)
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p Tools
          curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.xz | tar -xJ -C Tools LLVM-23.1.3-Linux-X64/bin/clang LLVM-23.1.3-Linux-X64/bin/clang-23 LLVM-23.1.3-Linux-X64/bin/mlir-opt LLVM-23.1.3-Linux-X64/bin/mlir-translate LLVM-23.1.3-Linux-X64/bin/opt LLVM-23.1.3-Linux-X64/bin/llc LLVM-23.1.3-Linux-X64/lib/clang/23/include
      - uses: actions/cache/save@v4
        if: steps.llvm.outputs.cache-hit != 'true'
        with:
          path: Tools/LLVM-23.1.3-Linux-X64
          key: llvm-23.1.3-linux-x64-opt-llc
      - name: Bootstrap from the seed
        run: |
          echo "$PWD/Tools/LLVM-23.1.3-Linux-X64/bin" >> "$GITHUB_PATH"
          sh Compiler/bootstrap.sh
      - name: The current compiler and VM (the seed builds them with its older code generation)
        run: |
          ./strict build Compiler/NativeCompiler.strict
          ./strict build Strict.strict
      - name: Unit tests on the Strict VM, one folder after another (each runs its files on all cores)
        if: env.UNITS != ''
        run: |
          failed=0
          for folder in $UNITS; do
            ./strict test "$folder" > "$folder/unit.log" 2>&1 || { grep -v "^Test passed" "$folder/unit.log"; failed=1; }
          done
          exit $failed
      - name: All tests of each file on the Strict VM, one process per file on all cores
        if: env.FILES != ''
        run: |
          for folder in $FILES; do ls "$folder"/*.strict; done | awk -v part="${PART%/*}" -v parts="${PART#*/}" '(NR - 1) % parts == part' > files.txt
          xargs -P "$(nproc)" -I {} sh -c './strict test "$1" > "$1.log" 2>&1 || { grep -v "^Test passed" "$1.log"; exit 1; }' _ {} < files.txt
      - name: Unit and Slow tests built natively, one test executable per folder
        if: env.NATIVE != ''
        run: |
          for folder in $NATIVE; do
            ./strict test "$folder" native > native.log 2>&1 || { code=$?; grep -v "^Test passed" native.log; echo "::error::native tests of $folder failed with exit code $code"; exit 1; }
          done
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      UNITS: Compression Validators Examples Math Networking Json Xml Binary
      NATIVE: Compression Validators Examples Math Json Xml Binary Runtime Expressions
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: llvm
        with:
          path: Tools/LLVM-23.1.3-Windows
          key: llvm-23.1.3-windows-opt-llc-lld
      - name: clang, opt, llc and lld-link 23
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p Tools/LLVM-23.1.3-Windows
          curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/clang+llvm-23.1.3-x86_64-pc-windows-msvc.tar.xz | tar -xJ -C Tools/LLVM-23.1.3-Windows --strip-components=1 clang+llvm-23.1.3-x86_64-pc-windows-msvc/bin/clang.exe clang+llvm-23.1.3-x86_64-pc-windows-msvc/bin/opt.exe clang+llvm-23.1.3-x86_64-pc-windows-msvc/bin/llc.exe clang+llvm-23.1.3-x86_64-pc-windows-msvc/bin/lld-link.exe clang+llvm-23.1.3-x86_64-pc-windows-msvc/lib/clang/23/include clang+llvm-23.1.3-x86_64-pc-windows-msvc/lib/clang/23/lib/windows/clang_rt.builtins-x86_64.lib
      - uses: actions/cache/save@v4
        if: steps.llvm.outputs.cache-hit != 'true'
        with:
          path: Tools/LLVM-23.1.3-Windows
          key: llvm-23.1.3-windows-opt-llc-lld
      - name: mlir-opt and mlir-translate 23 from MSYS2
        run: |
          /c/msys64/usr/bin/pacman.exe -Sy --noconfirm
          /c/msys64/usr/bin/pacman.exe -U --noconfirm https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-cc-libs-16.2.0-6-any.pkg.tar.zst https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-gcc-libs-16.2.0-6-any.pkg.tar.zst https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-llvm-libs-23.1.3-1-any.pkg.tar.zst https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-mlir-23.1.3-1-any.pkg.tar.zst
          cygpath -w "$PWD/Tools/LLVM-23.1.3-Windows/bin" >> "$GITHUB_PATH"
      - name: Bootstrap from the seed
        shell: cmd
        run: Compiler\Bootstrap.cmd
      - name: The current compiler and VM (the seed builds them with its older code generation)
        run: |
          ./strict.exe build Compiler/NativeCompiler.strict
          ./strict.exe build Strict.strict
      - name: Unit tests on the Strict VM, one folder after another (each runs its files on all cores)
        run: |
          failed=0
          for folder in $UNITS; do
            ./strict.exe test "$folder" > "$folder/unit.log" 2>&1 || { grep -v "^Test passed" "$folder/unit.log"; failed=1; }
          done
          exit $failed
      - name: Unit and Slow tests built natively, one test executable per folder
        run: |
          for folder in $NATIVE; do
            ./strict.exe test "$folder" native > native.log 2>&1 || { code=$?; grep -v "^Test passed" native.log; echo "::error::native tests of $folder failed with exit code $code"; exit 1; }
          done
