name: CI
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      FOLDERS: . Bytecode Compiler Compression Examples Examples/BaseTypesTest Examples/CompactTypeTest Examples/NativeAdd Examples/Parsing Expressions ImageProcessing MachineLearning Math NeuralNetworks Runtime Validators
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: llvm
        with:
          path: Tools/LLVM-22.1.0-Linux-X64
          key: llvm-22.1.0-linux-x64-headers
      - name: LLVM 22 (clang, mlir-opt, mlir-translate)
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p Tools
          curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/LLVM-22.1.0-Linux-X64.tar.xz | tar -xJ -C Tools LLVM-22.1.0-Linux-X64/bin/clang LLVM-22.1.0-Linux-X64/bin/clang-22 LLVM-22.1.0-Linux-X64/bin/mlir-opt LLVM-22.1.0-Linux-X64/bin/mlir-translate LLVM-22.1.0-Linux-X64/lib/clang/22/include
      - name: Bootstrap from the seed
        run: |
          echo "$PWD/Tools/LLVM-22.1.0-Linux-X64/bin" >> "$GITHUB_PATH"
          sh Compiler/bootstrap.sh
      - name: Self build until the fixpoint
        run: |
          for stage in 1 2 3; do
            rm -f Strict.strictbinary
            ./strict build Strict.strict
            cp Strict.mlir stage$stage.mlir
          done
          cmp stage2.mlir stage3.mlir
      - name: Tests on the Strict VM
        run: |
          for folder in $FOLDERS; do
            ./strict test "$folder" > test.log 2>&1 || { grep -v "^Test passed" test.log; exit 1; }
          done
      - name: Native builds and tests
        run: |
          for folder in $FOLDERS; do
            for file in "$folder"/*.strict; do
              ./strict build "$file" > build.log 2>&1 || { grep -v "^Test passed" build.log; exit 1; }
              base="${file%.strict}"
              if [ -f "$base.test" ]; then
                "./$base.test" > run.log 2>&1 || { grep -v "^Test passed" run.log; exit 1; }
                rm -f "$base.test" "$base.test.mlir"
              fi
            done
          done
  windows:
    runs-on: windows-latest
    env:
      FOLDERS: . Bytecode Compiler Compression Examples Examples/BaseTypesTest Examples/CompactTypeTest Examples/NativeAdd Examples/Parsing Expressions ImageProcessing MachineLearning Math NeuralNetworks Runtime Validators
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: llvm
        with:
          path: Tools/LLVM-22.1.0-Windows
          key: llvm-22.1.0-windows-clang-headers
      - name: clang 22
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p Tools/LLVM-22.1.0-Windows
          curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/clang+llvm-22.1.0-x86_64-pc-windows-msvc.tar.xz | tar -xJ -C Tools/LLVM-22.1.0-Windows --strip-components=1 clang+llvm-22.1.0-x86_64-pc-windows-msvc/bin/clang.exe clang+llvm-22.1.0-x86_64-pc-windows-msvc/lib/clang/22/include
      - name: mlir-opt and mlir-translate 22 from MSYS2
        run: |
          /c/msys64/usr/bin/pacman.exe -Sy --noconfirm
          /c/msys64/usr/bin/pacman.exe -U --noconfirm https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-llvm-libs-22.1.8-1-any.pkg.tar.zst https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-mlir-22.1.8-1-any.pkg.tar.zst
          cygpath -w "$PWD/Tools/LLVM-22.1.0-Windows/bin" >> "$GITHUB_PATH"
      - name: Bootstrap from the seed
        shell: cmd
        run: Compiler\Bootstrap.cmd
      - name: Self build until the fixpoint
        run: |
          for stage in 1 2 3; do
            rm -f Strict.strictbinary
            ./strict.exe build Strict.strict
            cp Strict.mlir stage$stage.mlir
          done
          cmp stage2.mlir stage3.mlir
      - name: Tests on the Strict VM
        run: |
          for folder in $FOLDERS; do
            ./strict.exe test "$folder" > test.log 2>&1 || { grep -v "^Test passed" test.log; exit 1; }
          done
      - name: Native builds and tests
        run: |
          for folder in $FOLDERS; do
            for file in "$folder"/*.strict; do
              ./strict.exe build "$file" > build.log 2>&1 || { grep -v "^Test passed" build.log; exit 1; }
              base="${file%.strict}"
              if [ -f "$base.test.exe" ]; then
                "./$base.test.exe" > run.log 2>&1 || { grep -v "^Test passed" run.log; exit 1; }
                rm -f "$base.test.exe" "$base.test.mlir" "$base.test"
              fi
            done
          done
