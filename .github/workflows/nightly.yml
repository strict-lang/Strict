name: Nightly
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  linux:
    name: nightly ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            folders: Compression Validators Examples ImageProcessing MachineLearning Math Networking Json Xml Binary
          - name: internal
            folders: Bytecode Runtime Expressions Compiler
          - name: neural
            folders: NeuralNetworks
    env:
      FOLDERS: ${{ matrix.folders }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: llvm
        with:
          path: Tools/LLVM-23.1.3-Linux-X64
          key: llvm-23.1.3-linux-x64-opt-llc
      - name: LLVM 23 (clang, mlir-opt, mlir-translate, opt, llc)
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p Tools
          curl -fsSL https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.xz | tar -xJ -C Tools LLVM-23.1.3-Linux-X64/bin/clang LLVM-23.1.3-Linux-X64/bin/clang-23 LLVM-23.1.3-Linux-X64/bin/mlir-opt LLVM-23.1.3-Linux-X64/bin/mlir-translate LLVM-23.1.3-Linux-X64/bin/opt LLVM-23.1.3-Linux-X64/bin/llc LLVM-23.1.3-Linux-X64/lib/clang/23/include
      - name: Bootstrap from the seed
        run: |
          echo "$PWD/Tools/LLVM-23.1.3-Linux-X64/bin" >> "$GITHUB_PATH"
          sh Compiler/bootstrap.sh
      - name: The current strict (the seed builds it with its older code generation)
        run: |
          ./strict build Cli/Strict.strict
      - name: Slow tests on the Strict VM and all tests including native ones built natively, one folder after another
        run: |
          failed=0
          for folder in $FOLDERS; do
            echo "$folder"; started=$SECONDS
            ./strict test "$folder" nightly > "$folder/nightly.log" 2>&1 || { grep -v "^Test passed" "$folder/nightly.log"; echo "::error::nightly tests of $folder failed"; failed=1; }
            echo "  done in $((SECONDS - started)) s"
          done
          exit $failed
