<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strict</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; color: #d8dee9; font: 16px system-ui, sans-serif; }
	#canvas { display: block; position: absolute; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; outline: none; }
	#overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0b0f14; }
	#name { font-size: 32px; letter-spacing: 1px; }
	#play { font: inherit; font-size: 22px; padding: 12px 44px; color: inherit; background: none; border: 2px solid #d8dee9; border-radius: 8px; cursor: pointer; }
	#play:disabled { opacity: 0.35; cursor: default; }
	#progress { width: min(320px, 80vw); height: 6px; background: #1f2933; border-radius: 3px; overflow: hidden; }
	#bar { width: 0; height: 100%; background: #5fb3f6; transition: width 0.2s; }
	#status { min-height: 1.4em; max-width: 90vw; text-align: center; color: #e88388; }
	#made { position: absolute; bottom: 14px; font-size: 13px; color: #6b7785; }
	#made a { color: inherit; }
	#fullscreen { position: absolute; right: 12px; bottom: 12px; display: none; padding: 6px 10px; font-size: 18px; color: #d8dee9; background: #0b0f14aa; border: 1px solid #3b4652; border-radius: 6px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="overlay">
	<div id="name"></div>
	<button id="play" disabled>Loading</button>
	<div id="progress"><div id="bar"></div></div>
	<div id="status"></div>
	<div id="made">Made with <a href="https://github.com/strict-lang/Strict">Strict</a> and the <a href="https://deltaengine.net">Delta Engine</a></div>
</div>
<button id="fullscreen" title="Fullscreen">&#x26F6;</button>
<script>
	const canvas = document.getElementById("canvas"), overlay = document.getElementById("overlay");
	const play = document.getElementById("play"), bar = document.getElementById("bar");
	const status = document.getElementById("status"), fullscreen = document.getElementById("fullscreen");
	const name = decodeURIComponent(location.pathname.split("/").pop().replace(/\.html$/, "")) || "Strict";
	document.title = name;
	document.getElementById("name").textContent = name;
	const failed = message => { status.textContent = message; overlay.style.display = "flex"; fullscreen.style.display = "none"; };
	var Module = {
		canvas: canvas,
		noInitialRun: true,
		print: text => console.log(text),
		printErr: text => console.error(text),
		setStatus: text => {
			const loaded = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
			if (loaded) bar.style.width = (100 * loaded[1] / loaded[2]) + "%";
		},
		onRuntimeInitialized: () => { bar.style.width = "100%"; play.disabled = false; play.textContent = "Play"; },
		onAbort: what => failed("Error: " + what),
		onExit: code => { if (code !== 0) failed("Exited with code " + code); }
	};
	play.onclick = () => {
		overlay.style.display = "none";
		fullscreen.style.display = "block";
		canvas.focus();
		Module.callMain([]);
	};
	fullscreen.onclick = () => canvas.requestFullscreen();
	window.addEventListener("keydown", event => {
		if ([" ", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Tab"].includes(event.key)) event.preventDefault();
	});
	window.addEventListener("error", event => failed(event.message));
</script>
{{{ SCRIPT }}}
</body>
</html>
